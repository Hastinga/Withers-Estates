<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Withers Estates | Lot Map</title>

  <style>
    :root{
      --available: rgba(40,167,69,.32);
      --pending: rgba(255,193,7,.42);
      --sold: rgba(220,53,69,.32);
      --unlisted: rgba(0,0,0,.06);

      --outline:#111;
      --bg:#f3f4f6;              /* modern light gray */
      --card:#ffffff;
      --muted:#6b7280;
      --panelBorder: rgba(0,0,0,.10);

      --hoverGlow: rgba(0,0,0,.28);

      --roadFill: #ffffff;
      --roadStroke: rgba(0,0,0,.20);
    }

    *{ box-sizing:border-box; }
    body{ margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:#111; }
    .wrap{ max-width:1200px; margin:0 auto; padding:18px 16px 40px; }

    h1{
      margin:0 0 10px;
      font-size:32px;
      text-align:center;
      letter-spacing:.2px;
    }

    /* REMOVE / HIDE the debug row completely */
    #debug{ display:none !important; }

    .topbar{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin: 0 0 12px;
    }
    .btnSmall{
      border:1px solid rgba(0,0,0,.15);
      background:#fff;
      padding:9px 12px;
      border-radius: 999px;
      font-weight:800;
      font-size: 13px;
      cursor:pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }
    .btnSmall.active{
      background:#111;
      color:#fff;
      border-color:#111;
    }

    .legend{
      display:flex; gap:12px; align-items:center; justify-content:center;
      margin:0 0 14px; font-size:13px; flex-wrap:wrap;
      color:#111;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      display:inline-block; margin-right:6px;
      border:1px solid rgba(0,0,0,.25); vertical-align:middle;
    }

    .mapCard{
      background:var(--card);
      border:1px solid var(--panelBorder);
      border-radius:16px;
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    .svgWrap{
      width:100%;
      height:780px;
      background:var(--bg);
      position:relative;
    }
    svg{ width:100%; height:100%; display:block; }

    /* Lots */
    .lot{
      cursor:pointer;
      transition: filter .12s ease, opacity .12s ease;
    }
    .lot:hover{
      filter: drop-shadow(0 0 10px var(--hoverGlow));
    }

    /* Lot labels */
    .lotLabel{
      font-size: 10px;
      font-weight: 600;
      fill: #111;
      pointer-events:none;
      paint-order: stroke fill;
      stroke: rgba(255,255,255,.95);
      stroke-width: 2px;
    }

    /* Premium icons line under label */
    .premiumLabel{
      font-size: 12px;
      font-weight: 800;
      fill:#111;
      pointer-events:none;
      paint-order: stroke fill;
      stroke: rgba(255,255,255,.95);
      stroke-width: 3px;
    }

    /* Hover tooltip */
    .we-tooltip{
      position:absolute;
      pointer-events:none;
      background:#111;
      color:#fff;
      padding:7px 9px;
      border-radius:10px;
      font-size:12px;
      font-weight:800;
      line-height:1.25;
      white-space:nowrap;
      transform:translate(-50%,-120%);
      opacity:0;
      transition:opacity .10s ease;
      z-index:20;
      box-shadow: 0 10px 30px rgba(0,0,0,.20);
    }
    .we-tooltip.show{ opacity:1; }

    /* Modal */
    .modalBack{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding:16px;
    }
    .modalBack.show{ display:flex; }

    .modal{
      width:min(520px, 100%);
      background: var(--card);
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.15);
      box-shadow: 0 20px 70px rgba(0,0,0,.35);
      overflow:hidden;
    }
    .modalHead{
      padding:14px 16px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      border-bottom: 1px solid rgba(0,0,0,.08);
    }
    .modalTitle{
      margin:0;
      font-size:18px;
      line-height:1.2;
      font-weight:900;
    }
    .modalClose{
      border:none;
      background:transparent;
      font-size:20px;
      cursor:pointer;
      color:#666;
      padding:0 4px;
    }
    .modalBody{
      padding:14px 16px 16px;
    }
    .meta{
      margin:6px 0 0;
      font-size:13px;
      color:var(--muted);
      line-height:1.35;
    }
    .kv{
      margin:12px 0 0;
      padding-left:18px;
      font-size:14px;
      line-height:1.35;
    }
    .pillRow{
      margin-top:10px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:6px;
      border:1px solid rgba(0,0,0,.10);
      background: rgba(0,0,0,.04);
      padding:6px 10px;
      border-radius: 999px;
      font-size:12px;
      font-weight:800;
      color:#111;
    }
    .reserveBtn{
      display:inline-block;
      margin-top:14px;
      width:100%;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,.15);
      background:#111;
      color:#fff;
      text-decoration:none;
      font-weight:900;
      font-size:14px;
      text-align:center;
    }

    @media (max-width: 980px){
      .svgWrap{ height:640px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Withers Estates</h1>
    <div id="debug">Loading…</div>

    <!-- Filters -->
    <div class="topbar">
      <button class="btnSmall active" data-filter="all">All Lots</button>
      <button class="btnSmall" data-filter="available">Available</button>
      <button class="btnSmall" data-filter="pending">Pending</button>
      <button class="btnSmall" data-filter="sold">Sold</button>
    </div>

    <!-- Legend -->
    <div class="legend">
      <span><i class="dot" style="background:var(--available)"></i>Available</span>
      <span><i class="dot" style="background:var(--pending)"></i>Pending</span>
      <span><i class="dot" style="background:var(--sold)"></i>Sold</span>
      <span><i class="dot" style="background:var(--unlisted)"></i>Unlisted</span>
    </div>

    <div class="mapCard">
      <div class="svgWrap" id="svgWrap">
        <svg id="lotSvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="lotTooltip" class="we-tooltip"></div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modalBack" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalHead">
        <div>
          <h2 class="modalTitle" id="mTitle">Lot</h2>
          <div class="meta" id="mMeta"></div>
        </div>
        <button class="modalClose" id="modalClose" title="Close">×</button>
      </div>
      <div class="modalBody">
        <div class="pillRow" id="mPills"></div>
        <ul class="kv" id="mNotes"></ul>
        <a class="reserveBtn" id="mReserve" href="#" target="_blank" rel="noopener">Reserve This Lot</a>
      </div>
    </div>
  </div>

  <script>
    // ====== YOUR SOURCES ======
    const LOTS_JSON_URL = 'withers-estates-lots2.json';
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLq9bYnDWEQnE4-GUmwyYStBWKlOdrCy36utkl0cHahd7u-7YlkHn-0BgmS6L9NyH_Qj6nPzi4IPs3/pub?output=csv';
    const DEFAULT_RESERVE_URL = 'https://form.jotform.com/260066170475051';
    // ==========================

    // Label mode: "BLOCK_AND_LOT" shows "B2 - L1", "LOT_ONLY" shows "L1"
    const LABEL_MODE = "BLOCK_AND_LOT";

    // ✅ Put your premium lots here (the “far right luxury view lots”)
    // Use either "B1-L6" or "B1 - L6" — both will match.
    const PREMIUM_LOTS = new Set([
      // EXAMPLES (replace with yours):
      // 'B1-L6','B1-L7','B1-L8','B1-L9',
      // 'B4-L1','B4-L2','B4-L3'
    ]);

    // Premium icons (feel free to change)
    const PREMIUM_ICONS = '🏔 ⛪ 🌾'; // Teton views, temple view, country luxury

    const svg = document.getElementById('lotSvg');
    const svgWrap = document.getElementById('svgWrap');
    const tooltip = document.getElementById('lotTooltip');

    const modalBack = document.getElementById('modalBack');
    const modalClose = document.getElementById('modalClose');
    const mTitle = document.getElementById('mTitle');
    const mMeta  = document.getElementById('mMeta');
    const mNotes = document.getElementById('mNotes');
    const mReserve = document.getElementById('mReserve');
    const mPills = document.getElementById('mPills');

    const filterButtons = Array.from(document.querySelectorAll('.btnSmall'));
    let currentFilter = 'all';

    // --- Modal controls
    function openModal(){
      modalBack.classList.add('show');
      modalBack.setAttribute('aria-hidden','false');
    }
    function closeModal(){
      modalBack.classList.remove('show');
      modalBack.setAttribute('aria-hidden','true');
    }
    modalClose.addEventListener('click', closeModal);
    modalBack.addEventListener('click', (e)=>{
      if (e.target === modalBack) closeModal();
    });
    document.addEventListener('keydown', (e)=>{
      if (e.key === 'Escape') closeModal();
    });

    function getCssVar(name){
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function polygonPath(points){
      return points.map((p,i)=> (i===0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ') + ' Z';
    }

    function polygonCentroid(points){
      let x = 0, y = 0, a = 0;
      for (let i=0, j=points.length-1; i<points.length; j=i++){
        const p1 = points[j], p2 = points[i];
        const f = (p1.x * p2.y) - (p2.x * p1.y);
        a += f;
        x += (p1.x + p2.x) * f;
        y += (p1.y + p2.y) * f;
      }
      a *= 0.5;
      if (a === 0){
        const avg = points.reduce((acc,p)=>({x:acc.x+p.x,y:acc.y+p.y}),{x:0,y:0});
        return { x: avg.x / points.length, y: avg.y / points.length };
      }
      return { x: x / (6*a), y: y / (6*a) };
    }

    // Handles: "B1-L1", "B1 - L1", "B1 — L1", "Block 1 Lot 1"
    function normalizeLotId(raw){
      if (!raw) return '';
      const s = String(raw)
        .trim()
        .toUpperCase()
        .replace(/[–—]/g,'-')
        .replace(/#/g,'')
        .replace(/\s+/g,' ')
        .replace(/\s*-\s*/g,'-'); // normalize hyphen spacing to B1-L1

      const m = s.match(/BLOCK\s*(\d+)\s*[- ]?\s*LOT\s*(\d+)/i);
      if (m) return `B${m[1]}-L${m[2]}`;

      const m2 = s.match(/B\s*(\d+)\s*[- ]?\s*L\s*(\d+)/i);
      if (m2) return `B${m2[1]}-L${m2[2]}`;

      return s;
    }

    function displayLotId(normKey){
      if (!normKey) return '';
      if (LABEL_MODE === 'LOT_ONLY'){
        const m = normKey.match(/L(\d+)/i);
        return m ? `L${m[1]}` : normKey;
      }
      // show as "B1 - L1" for readability
      return normKey.replace('-', ' - ');
    }

    function isPremium(normKey){
      return PREMIUM_LOTS.has(normKey) || PREMIUM_LOTS.has(normKey.replace('-', ' - '));
    }

    function statusKey(status){
      const st = String(status || '').trim().toLowerCase();
      if (st.includes('sold')) return 'sold';
      if (st.includes('pend')) return 'pending';
      if (st.includes('avail')) return 'available';
      return 'unlisted';
    }

    function fillForStatus(status){
      const k = statusKey(status);
      if (k === 'sold') return getCssVar('--sold');
      if (k === 'pending') return getCssVar('--pending');
      if (k === 'available') return getCssVar('--available');
      return getCssVar('--unlisted');
    }

    function parseMoney(val){
      if (val == null) return '';
      const n = String(val).replace(/[^0-9.]/g,'').trim();
      if (!n) return '';
      const num = Number(n);
      if (Number.isNaN(num)) return '';
      return num.toLocaleString(undefined, { style:'currency', currency:'USD', maximumFractionDigits:0 });
    }

    function parseCSV(text){
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i=0; i<text.length; i++){
        const c = text[i];
        const next = text[i+1];

        if (c === '"' && inQuotes && next === '"'){ cur += '"'; i++; continue; }
        if (c === '"'){ inQuotes = !inQuotes; continue; }
        if (c === ',' && !inQuotes){ row.push(cur); cur=''; continue; }

        if ((c === '\n' || c === '\r') && !inQuotes){
          if (c === '\r' && next === '\n') i++;
          row.push(cur);
          if (row.some(v => String(v).trim() !== '')) rows.push(row);
          row = []; cur='';
          continue;
        }
        cur += c;
      }

      if (cur.length || row.length){
        row.push(cur);
        if (row.some(v => String(v).trim() !== '')) rows.push(row);
      }
      return rows;
    }

    function rowsToObjects(rows){
      if (!rows || !rows.length) return [];
      const headers = rows[0].map(h => String(h).trim());
      const objs = [];
      for (let i=1; i<rows.length; i++){
        const r = rows[i];
        const o = {};
        headers.forEach((h, idx) => o[h] = r[idx] ?? '');
        objs.push(o);
      }
      return objs;
    }

    function setViewBoxToFit(allPoints){
      const xs = allPoints.map(p => p.x);
      const ys = allPoints.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const pad = 26;
      const vb = { x:minX-pad, y:minY-pad, w:(maxX-minX)+pad*2, h:(maxY-minY)+pad*2 };
      svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      return vb;
    }

    function getViewBox(){
      const vb = svg.getAttribute('viewBox').split(' ').map(Number);
      return { x:vb[0], y:vb[1], w:vb[2], h:vb[3] };
    }
    function setViewBox(vb){
      svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    }

    function notesToLines(notes){
      return String(notes || '')
        .split(/\n+/)
        .map(v => v.trim())
        .filter(Boolean)
        .map(v => v.replace(/^•\s*/,'')); // remove bullet if present
    }

    function applyFilter(){
      const lotPaths = svg.querySelectorAll('.lot[data-status]');
      lotPaths.forEach(el => {
        const st = el.getAttribute('data-status') || 'unlisted';
        const show = (currentFilter === 'all') || (st === currentFilter);
        el.style.display = show ? '' : 'none';
      });

      const labels = svg.querySelectorAll('text[data-for]');
      labels.forEach(t => {
        const st = t.getAttribute('data-status') || 'unlisted';
        const show = (currentFilter === 'all') || (st === currentFilter);
        t.style.display = show ? '' : 'none';
      });
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        applyFilter();
      });
    });

    // --- Pan + zoom
    let isDragging = false;
    let dragStart = {x:0,y:0};
    let vbStart = null;

    svgWrap.addEventListener('wheel', (e)=>{
      e.preventDefault();
      const vb = getViewBox();

      // mouse position relative to svgWrap
      const rect = svgWrap.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width;
      const my = (e.clientY - rect.top) / rect.height;

      const zoomFactor = (e.deltaY > 0) ? 1.08 : 0.92; // wheel down = zoom out
      const newW = vb.w * zoomFactor;
      const newH = vb.h * zoomFactor;

      const dx = (vb.w - newW) * mx;
      const dy = (vb.h - newH) * my;

      setViewBox({ x: vb.x + dx, y: vb.y + dy, w: newW, h: newH });
    }, { passive:false });

    svgWrap.addEventListener('mousedown', (e)=>{
      isDragging = true;
      dragStart = { x:e.clientX, y:e.clientY };
      vbStart = getViewBox();
    });
    window.addEventListener('mousemove', (e)=>{
      if (!isDragging) return;
      const rect = svgWrap.getBoundingClientRect();
      const dxPx = e.clientX - dragStart.x;
      const dyPx = e.clientY - dragStart.y;

      // Convert pixels to viewBox units
      const dx = -(dxPx / rect.width) * vbStart.w;
      const dy = -(dyPx / rect.height) * vbStart.h;

      setViewBox({ x: vbStart.x + dx, y: vbStart.y + dy, w: vbStart.w, h: vbStart.h });
    });
    window.addEventListener('mouseup', ()=>{ isDragging = false; });

    async function main(){
      const lotsRes = await fetch(LOTS_JSON_URL, { cache: 'no-store' });
      if (!lotsRes.ok) throw new Error(`Lots JSON failed: ${lotsRes.status}`);
      const shapeData = await lotsRes.json();

      const csvRes = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if (!csvRes.ok) throw new Error(`Sheet CSV failed: ${csvRes.status}`);
      const csvText = await csvRes.text();

      const sheetObjs = rowsToObjects(parseCSV(csvText));

      // lookup by normalized lot id
      const sheetByLot = new Map();
      for (const row of sheetObjs){
        const key = normalizeLotId(row['Lot ID'] || row['LotID'] || row['Lot'] || row['Lot Id'] || '');
        if (key) sheetByLot.set(key, row);
      }

      svg.innerHTML = '';
      const shapes = (shapeData.shapes || []).filter(s => Array.isArray(s.points) && s.points.length);

      // viewBox fit
      const allPts = shapes.flatMap(s => s.points);
      if (allPts.length) setViewBoxToFit(allPts);

      // groups
      const gRoads = document.createElementNS('http://www.w3.org/2000/svg','g');
      const gLots = document.createElementNS('http://www.w3.org/2000/svg','g');
      const gLabels = document.createElementNS('http://www.w3.org/2000/svg','g');
      svg.appendChild(gRoads);
      svg.appendChild(gLots);
      svg.appendChild(gLabels);

      for (const s of shapes){
        const rawId = (s.label || s.name || s.id || '');
        const lotKey = normalizeLotId(rawId);
        const isLot = /^B\d+-L\d+$/i.test(lotKey);

        // --- Non-lot shapes (roads/features): draw ONLY, NO LABELS (removes street names)
        if (!isLot){
          const road = document.createElementNS('http://www.w3.org/2000/svg','path');
          road.setAttribute('d', polygonPath(s.points));
          road.setAttribute('fill', getCssVar('--roadFill'));
          road.setAttribute('stroke', getCssVar('--roadStroke'));
          road.setAttribute('stroke-width', '2');
          gRoads.appendChild(road);
          continue;
        }

        const row = sheetByLot.get(lotKey) || null;
        const status = row ? row['Status'] : 'Unlisted';
        const price  = row ? row['Price'] : '';
        const lotSize = row ? row['Lot Size'] : '';
        const notes = row ? row['Notes'] : '';
        const reserve = (row && row['Reserve']) ? row['Reserve'] : DEFAULT_RESERVE_URL;

        const stKey = statusKey(status);

        // Lot path
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d', polygonPath(s.points));
        path.setAttribute('fill', fillForStatus(status));
        path.setAttribute('stroke', '#111');
        path.setAttribute('stroke-width', '3');
        path.setAttribute('class', 'lot');
        path.setAttribute('data-lot', lotKey);
        path.setAttribute('data-status', stKey);
        gLots.appendChild(path);

        const displayId = displayLotId(lotKey);
        const priceTxt = price ? parseMoney(price) : '';
        const statusTxt = status || '';

        // Hover tooltip
        path.addEventListener('mousemove', (e)=>{
          const rect = svgWrap.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          tooltip.innerHTML = `${displayId}<br>${statusTxt}${priceTxt ? `<br>${priceTxt}` : ''}`;
          tooltip.style.left = x + 'px';
          tooltip.style.top  = y + 'px';
          tooltip.classList.add('show');
        });
        path.addEventListener('mouseleave', ()=>{
          tooltip.classList.remove('show');
        });

        // Click -> Modal popup
        path.addEventListener('click', ()=>{
          mTitle.textContent = displayId;

          const metaParts = [];
          metaParts.push(`Status: ${statusTxt || '—'}`);
          if (price) metaParts.push(`Price: ${priceTxt || price}`);
          if (lotSize) metaParts.push(`Lot Size: ${lotSize}`);
          mMeta.textContent = metaParts.join(' • ');

          // pills (premium)
          mPills.innerHTML = '';
          if (isPremium(lotKey)){
            const pill = document.createElement('div');
            pill.className = 'pill';
            pill.textContent = `${PREMIUM_ICONS} Luxury Views`;
            mPills.appendChild(pill);
          }

          // notes
          mNotes.innerHTML = '';
          const lines = notesToLines(notes);
          if (lines.length){
            lines.forEach(line=>{
              const li = document.createElement('li');
              li.textContent = line;
              mNotes.appendChild(li);
            });
          } else {
            const li = document.createElement('li');
            li.textContent = 'Details coming soon for this lot.';
            mNotes.appendChild(li);
          }

          mReserve.href = reserve || DEFAULT_RESERVE_URL;
          openModal();
        });

        // Lot label centered
        const c = polygonCentroid(s.points);

        const label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x', c.x);
        label.setAttribute('y', c.y);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'middle');
        label.setAttribute('class', 'lotLabel');
        label.setAttribute('data-for', lotKey);
        label.setAttribute('data-status', stKey);
        label.textContent = displayId;
        gLabels.appendChild(label);

        // Premium icon line under label
        if (isPremium(lotKey)){
          const icon = document.createElementNS('http://www.w3.org/2000/svg','text');
          icon.setAttribute('x', c.x);
          icon.setAttribute('y', c.y + 16);
          icon.setAttribute('text-anchor', 'middle');
          icon.setAttribute('dominant-baseline', 'middle');
          icon.setAttribute('class', 'premiumLabel');
          icon.setAttribute('data-for', lotKey);
          icon.setAttribute('data-status', stKey);
          icon.textContent = PREMIUM_ICONS;
          gLabels.appendChild(icon);
        }
      }

      applyFilter();
    }

    main().catch(err => {
      console.error(err);
      // No debug on page, so if you want errors you can open DevTools console
      // or temporarily turn #debug back on.
    });
  </script>
</body>
</html>
