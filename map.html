<script>
  const LOTS_JSON_URL = 'withers-estates-lots1.json';

  // Your published Google Sheet CSV
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLq9bYnDWEQnE4-GUmwyYStBWKlOdrCy36utkl0cHahd7u-7YlkHn-0BgmS6L9NyH_Qj6nPzi4IPs3/pub?output=csv';

  // Fallback reserve link if your sheet Reserve column is empty
  const DEFAULT_RESERVE_URL = 'https://form.jotform.com/260066170475051';

  const svg = document.getElementById('lotSvg');
  const popup = document.getElementById('popup');
  const pTitle = document.getElementById('pTitle');
  const pMeta  = document.getElementById('pMeta');
  const pNotes = document.getElementById('pNotes');
  const pReserve = document.getElementById('pReserve');
  document.getElementById('close').onclick = () => popup.style.display = 'none';

  // ---- Helpers ----
  function polygonPath(points){
    return points.map((pt,i)=> (i===0?`M ${pt.x} ${pt.y}`:`L ${pt.x} ${pt.y}`)).join(' ') + ' Z';
  }

  // Normalize ID so these all match:
  // "B2 - L8" == "B2-L8" == "Block 2 - Lot 8" == "block2 lot8"
  function normalizeLotId(raw){
    if (!raw) return '';
    const s = String(raw).trim().toUpperCase();

    // Convert "BLOCK 2 - LOT 8" -> "B2 - L8"
    const m = s.match(/BLOCK\s*(\d+)\s*[-–]?\s*LOT\s*(\d+)/i);
    if (m) return `B${m[1]} - L${m[2]}`;

    // Convert "B2 L8" or "B2-L8" or "B2 - L8" -> "B2 - L8"
    const m2 = s.match(/B\s*(\d+)\s*[-– ]?\s*L\s*(\d+)/i);
    if (m2) return `B${m2[1]} - L${m2[2]}`;

    return s.replace(/\s+/g,' ').trim();
  }

  function parseMoney(val){
    if (val == null) return '';
    const n = String(val).replace(/[^0-9.]/g,'').trim();
    if (!n) return '';
    const num = Number(n);
    if (Number.isNaN(num)) return '';
    return num.toLocaleString(undefined, { style:'currency', currency:'USD', maximumFractionDigits:0 });
  }

  function parseCSV(text){
    // Small CSV parser that handles quoted commas
    const rows = [];
    let row = [];
    let cur = '';
    let inQuotes = false;

    for (let i=0; i<text.length; i++){
      const c = text[i];
      const next = text[i+1];

      if (c === '"' && inQuotes && next === '"'){ // escaped quote
        cur += '"';
        i++;
        continue;
      }
      if (c === '"'){
        inQuotes = !inQuotes;
        continue;
      }
      if (c === ',' && !inQuotes){
        row.push(cur);
        cur = '';
        continue;
      }
      if ((c === '\n' || c === '\r') && !inQuotes){
        if (c === '\r' && next === '\n') i++; // windows newline
        row.push(cur);
        cur = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
        continue;
      }
      cur += c;
    }
    // last cell
    row.push(cur);
    if (row.length > 1 || row[0] !== '') rows.push(row);

    return rows;
  }

  function statusColor(statusRaw){
    const s = String(statusRaw || '').toLowerCase();
    if (s.includes('sold')) return 'rgba(220, 53, 69, 0.22)';     // red tint
    if (s.includes('pend')) return 'rgba(255, 193, 7, 0.28)';     // yellow tint
    if (s.includes('avail')) return 'rgba(40, 167, 69, 0.22)';    // green tint
    return 'rgba(0,0,0,0.03)'; // default
  }

  function notesToBullets(notesRaw){
    const txt = String(notesRaw || '').trim();
    if (!txt) return [];
    // supports bullets separated by newlines or "•"
    return txt
      .split(/\n|•/g)
      .map(s => s.trim())
      .filter(Boolean);
  }

  async function loadSheetMap(){
    const csvText = await fetch(SHEET_CSV_URL, { cache: 'no-store' }).then(r => r.text());
    const rows = parseCSV(csvText);
    if (!rows.length) return new Map();

    const headers = rows[0].map(h => h.trim().toLowerCase());
    const idx = (name) => headers.indexOf(name.toLowerCase());

    const iLot = idx('lot id');
    const iStatus = idx('status');
    const iPrice = idx('price');
    const iSize = idx('lot size');
    const iNotes = idx('notes');
    const iReserve = idx('reserve');

    const map = new Map();

    for (let r=1; r<rows.length; r++){
      const row = rows[r];
      const lotIdRaw = row[iLot] ?? '';
      const lotKey = normalizeLotId(lotIdRaw);
      if (!lotKey) continue;

      map.set(lotKey, {
        lotId: lotKey,
        status: row[iStatus] ?? '',
        price: row[iPrice] ?? '',
        lotSize: row[iSize] ?? '',
        notes: row[iNotes] ?? '',
        reserve: (iReserve >= 0 ? (row[iReserve] ?? '') : '')
      });
    }

    return map;
  }

  async function main(){
    const [shapeData, sheetMap] = await Promise.all([
      fetch(LOTS_JSON_URL).then(r => r.json()),
      loadSheetMap()
    ]);

    // Draw lots
    shapeData.shapes
      .filter(s => s.type === 'lot' && Array.isArray(s.points) && s.points.length)
      .forEach(s => {
        const lotLabel = s.label || s.id;
        const lotKey = normalizeLotId(lotLabel);
        const row = sheetMap.get(lotKey);

        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d', polygonPath(s.points));
        path.setAttribute('class', 'lot');
        path.dataset.lot = lotKey;

        // Color by status (from sheet)
        path.style.fill = statusColor(row?.status);

        path.addEventListener('click', () => {
          popup.style.display = 'block';

          const status = row?.status || '—';
          const price = parseMoney(row?.price) || (row?.price || '—');
          const lotSize = row?.lotSize || '—';
          const bullets = notesToBullets(row?.notes);

          pTitle.textContent = lotKey;
          pMeta.textContent = `Status: ${status} • Price: ${price} • Lot Size: ${lotSize}`;

          pNotes.innerHTML = '';
          (bullets.length ? bullets : ['Lot details coming from Google Sheet (add Notes to populate bullets)'])
            .forEach(t => {
              const li = document.createElement('li');
              li.textContent = t;
              pNotes.appendChild(li);
            });

          const reserveUrl = (row?.reserve || '').trim() || DEFAULT_RESERVE_URL;
          pReserve.href = reserveUrl;
        });

        svg.appendChild(path);
      });

    // Fit viewBox to all drawn shapes
    const bb = svg.getBBox();
    svg.setAttribute('viewBox', `${bb.x} ${bb.y} ${bb.width} ${bb.height}`);
  }

  main().catch(err => {
    console.error(err);
    alert('Could not load lot data. Check JSON filename + Sheet headers.');
  });
</script>
