<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Withers Estates Lot Map</title>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>

<style>
body { margin:0; padding:0; }
#map { width:100%; height:100vh; }
</style>

</head>

<body>

<div id="map"></div>

<script>

mapboxgl.accessToken = 'pk.eyJ1IjoiaGFzdGluZ2EiLCJhIjoiY2tvZW9rYzU1MDd6eTJwbWlkdzNwOXFxOCJ9.UmUYmDzNPjEz5cuq2SkGiw';

const map = new mapboxgl.Map({
container: 'map',
style: 'mapbox://styles/mapbox/light-v11',
center: [-111.78, 43.82],
zoom: 15
});

map.on('load', function () {

map.addSource('lots', {
'type': 'geojson',
'data': 'withers-estates-lots1.json'
});

map.addLayer({
'id': 'lots-fill',
'type': 'fill',
'source': 'lots',
'paint': {
'fill-color': '#4CAF50',
'fill-opacity': 0.4
}
});

map.addLayer({
'id': 'lots-outline',
'type': 'line',
'source': 'lots',
'paint': {
'line-color': '#000',
'line-width': 2
}
});

map.on('click', 'lots-fill', function (e) {

const lot = e.features[0].properties.name || "Lot";

new mapboxgl.Popup()
.setLngLat(e.lngLat)
.setHTML("<h3>" + lot + "</h3>")
.addTo(map);

});

});

</script>

</body>
</html>
