<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Withers Estates | Lot Map</title>

  <style>
    :root{
      --available: rgba(40,167,69,.32);
      --pending: rgba(255,193,7,.42);
      --sold: rgba(220,53,69,.32);
      --unlisted: rgba(0,0,0,.06);

      --outline:#111;
      --bg:#ffffff;
      --card:#ffffff;
      --muted:#6b7280;
      --panelBorder: rgba(0,0,0,.10);

      --hoverGlow: rgba(0,0,0,.20);
    }

    body{ margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--bg); color:#111; }
    .wrap{ max-width:1200px; margin:0 auto; padding:18px 16px 40px; }

    h1{
      margin:0 0 6px;
      font-size:30px;
      text-align:center;
      letter-spacing:.2px;
    }

    #debug{ text-align:center; margin:0 0 12px; font-size:13px; color:var(--muted); }

    .topbar{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      margin: 0 0 14px;
    }

    .btnSmall{
      border:1px solid rgba(0,0,0,.15);
      background:#fff;
      padding:9px 10px;
      border-radius: 999px;
      font-weight:700;
      font-size: 13px;
      cursor:pointer;
    }
    .btnSmall.active{
      background:#111;
      color:#fff;
      border-color:#111;
    }

    .legend{
      display:flex; gap:12px; align-items:center; justify-content:center;
      margin:0 0 14px; font-size:13px; flex-wrap:wrap;
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      display:inline-block; margin-right:6px;
      border:1px solid rgba(0,0,0,.25); vertical-align:middle;
    }

    .stage{ display:grid; grid-template-columns: 1fr 340px; gap:18px; align-items:start; }
    .mapCard{ background:var(--card); border:1px solid var(--panelBorder); border-radius:12px; overflow:hidden; }

    .svgWrap{ width:100%; height:720px; background:#fff; position:relative; }
    svg{ width:100%; height:100%; display:block; }

    .panel{
      background:var(--card);
      border:1px solid var(--panelBorder);
      border-radius:12px;
      padding:14px 14px 12px;
      position:sticky; top:14px;
    }
    .panelTop{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .panel h2{ margin:0; font-size:18px; line-height:1.2; }
    .closeBtn{ border:none; background:transparent; font-size:18px; cursor:pointer; color:#666; }
    .meta{ margin:8px 0 0; font-size:13px; color:var(--muted); line-height: 1.35; }
    .kv{ margin:10px 0 0; padding-left:18px; font-size:14px; line-height:1.35; }

    .reserveBtn{
      display:inline-block; margin-top:12px; padding:10px 12px;
      border-radius:10px; border:1px solid rgba(0,0,0,.15);
      background:#111; color:#fff; text-decoration:none; font-weight:800; font-size:14px; text-align:center;
    }
    .hint{ font-size:12px; color:var(--muted); margin-top:10px; line-height:1.35; }

    /* Lots */
    .lot{
      cursor:pointer;
      transition: filter .12s ease, opacity .12s ease;
    }
    .lot:hover{
      filter: drop-shadow(0 0 8px var(--hoverGlow));
    }

    /* Big readable labels */
   .lotLabel{
  font-size: 14px;
  font-weight: 700;
  fill: #111;
  pointer-events:none;

  /* crisp halo for readability */
  paint-order: stroke fill;
  stroke: rgba(255,255,255,.98);
  stroke-width: 3px;
}

    /* Small badge text (premium lots) */
    .badge{
  font-size: 12px;
  font-weight: 800;
      fill: #111;
      pointer-events:none;
      paint-order: stroke fill;
      stroke: rgba(255,255,255,.95);
      stroke-width: 4px;
    }

    @media (max-width: 980px){
      .stage{ grid-template-columns:1fr; }
      .panel{ position:relative; top:0; }
      .svgWrap{ height:620px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Withers Estates</h1>
    <div id="debug">Loading…</div>

    <!-- Filters -->
    <div class="topbar">
      <button class="btnSmall active" data-filter="all">All Lots</button>
      <button class="btnSmall" data-filter="available">Available</button>
      <button class="btnSmall" data-filter="pending">Pending</button>
      <button class="btnSmall" data-filter="sold">Sold</button>
    </div>

    <!-- Legend -->
    <div class="legend">
      <span><i class="dot" style="background:var(--available)"></i>Available</span>
      <span><i class="dot" style="background:var(--pending)"></i>Pending</span>
      <span><i class="dot" style="background:var(--sold)"></i>Sold</span>
      <span><i class="dot" style="background:var(--unlisted)"></i>Unlisted</span>
    </div>

    <div class="stage">
      <div class="mapCard">
        <div class="svgWrap">
          <svg id="lotSvg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>

      <div class="panel">
        <div class="panelTop">
          <h2 id="pTitle">Click a lot</h2>
          <button class="closeBtn" id="close" title="Close">×</button>
        </div>
        <div class="meta" id="pMeta">Select a lot to see details.</div>
        <ul class="kv" id="pNotes"></ul>
        <a class="reserveBtn" id="pReserve" href="#" target="_blank" rel="noopener">Reserve Lot</a>
        <div class="hint">
          Tip: Update your Google Sheet → refresh to update colors/details.
        </div>
      </div>
    </div>
  </div>

  <script>
    // ====== YOUR SOURCES ======
    const LOTS_JSON_URL = 'withers-estates-lots1.json';
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRLq9bYnDWEQnE4-GUmwyYStBWKlOdrCy36utkl0cHahd7u-7YlkHn-0BgmS6L9NyH_Qj6nPzi4IPs3/pub?output=csv';
    const DEFAULT_RESERVE_URL = 'https://form.jotform.com/260066170475051';
    // ==========================

    // Label mode: "BLOCK_AND_LOT" shows "B2 - L1", "LOT_ONLY" shows "L1"
    const LABEL_MODE = "BLOCK_AND_LOT";

    // Premium lots rule:
    // You said: "every lot on the far right will have a temple view, view of the teton mountains, and country luxury views"
    // Easiest rule: set this list to the exact lot IDs that are premium.
    // Example: ['B4 - L8','B4 - L9'] etc
    const PREMIUM_LOTS = new Set([
      // TODO: paste your far-right lot IDs here, like:
      // 'B5 - L1','B5 - L2'
    ]);

    const svg = document.getElementById('lotSvg');
    const debugEl = document.getElementById('debug');

    const pTitle = document.getElementById('pTitle');
    const pMeta  = document.getElementById('pMeta');
    const pNotes = document.getElementById('pNotes');
    const pReserve = document.getElementById('pReserve');

    const filterButtons = Array.from(document.querySelectorAll('.btnSmall'));
    let currentFilter = 'all';

    document.getElementById('close').onclick = () => {
      pTitle.textContent = 'Click a lot';
      pMeta.textContent = 'Select a lot to see details.';
      pNotes.innerHTML = '';
      pReserve.href = DEFAULT_RESERVE_URL;
    };

    function getCssVar(name){
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function polygonPath(points){
      return points.map((p,i)=> (i===0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ') + ' Z';
    }

    function polygonCentroid(points){
      let x = 0, y = 0, a = 0;
      for (let i=0, j=points.length-1; i<points.length; j=i++){
        const p1 = points[j], p2 = points[i];
        const f = (p1.x * p2.y) - (p2.x * p1.y);
        a += f;
        x += (p1.x + p2.x) * f;
        y += (p1.y + p2.y) * f;
      }
      a *= 0.5;
      if (a === 0){
        const avg = points.reduce((acc,p)=>({x:acc.x+p.x,y:acc.y+p.y}),{x:0,y:0});
        return { x: avg.x / points.length, y: avg.y / points.length };
      }
      return { x: x / (6*a), y: y / (6*a) };
    }

    function normalizeLotId(raw){
      if (!raw) return '';
      const s = String(raw).trim().toUpperCase().replace(/[–—]/g,'-').replace(/#/g,'').replace(/\s+/g,' ');

      const m = s.match(/BLOCK\s*(\d+)\s*[- ]?\s*LOT\s*(\d+)/i);
      if (m) return `B${m[1]} - L${m[2]}`;

      const m2 = s.match(/B\s*(\d+)\s*[- ]?\s*L\s*(\d+)/i);
      if (m2) return `B${m2[1]} - L${m2[2]}`;

      return s;
    }

    function formatLabel(lotKey){
      if (!lotKey) return '';
      if (LABEL_MODE === 'LOT_ONLY'){
        const m = lotKey.match(/L\s*(\d+)/i);
        return m ? `L${m[1]}` : lotKey;
      }
      return lotKey;
    }

    function statusKey(status){
      const st = String(status || '').trim().toLowerCase();
      if (st.includes('sold')) return 'sold';
      if (st.includes('pend')) return 'pending';
      if (st.includes('avail')) return 'available';
      return 'unlisted';
    }

    function fillForStatus(status){
      const k = statusKey(status);
      if (k === 'sold') return getCssVar('--sold');
      if (k === 'pending') return getCssVar('--pending');
      if (k === 'available') return getCssVar('--available');
      return getCssVar('--unlisted');
    }

    function parseMoney(val){
      if (val == null) return '';
      const n = String(val).replace(/[^0-9.]/g,'').trim();
      if (!n) return '';
      const num = Number(n);
      if (Number.isNaN(num)) return '';
      return num.toLocaleString(undefined, { style:'currency', currency:'USD', maximumFractionDigits:0 });
    }

    function parseCSV(text){
      const rows = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i=0; i<text.length; i++){
        const c = text[i];
        const next = text[i+1];

        if (c === '"' && inQuotes && next === '"'){ cur += '"'; i++; continue; }
        if (c === '"'){ inQuotes = !inQuotes; continue; }

        if (c === ',' && !inQuotes){ row.push(cur); cur=''; continue; }

        if ((c === '\n' || c === '\r') && !inQuotes){
          if (c === '\r' && next === '\n') i++;
          row.push(cur);
          if (row.some(v => String(v).trim() !== '')) rows.push(row);
          row = []; cur='';
          continue;
        }
        cur += c;
      }

      if (cur.length || row.length){
        row.push(cur);
        if (row.some(v => String(v).trim() !== '')) rows.push(row);
      }
      return rows;
    }

    function rowsToObjects(rows){
      if (!rows || !rows.length) return [];
      const headers = rows[0].map(h => String(h).trim());
      const objs = [];
      for (let i=1; i<rows.length; i++){
        const r = rows[i];
        const o = {};
        headers.forEach((h, idx) => o[h] = r[idx] ?? '');
        objs.push(o);
      }
      return objs;
    }

    function setViewBoxToFit(allPoints){
      const xs = allPoints.map(p => p.x);
      const ys = allPoints.map(p => p.y);
      const minX = Math.min(...xs), maxX = Math.max(...xs);
      const minY = Math.min(...ys), maxY = Math.max(...ys);
      const pad = 25;
      svg.setAttribute('viewBox', `${minX-pad} ${minY-pad} ${(maxX-minX)+pad*2} ${(maxY-minY)+pad*2}`);
    }

    function notesToLines(notes){
      return String(notes || '')
        .split(/\n+/)
        .map(v => v.trim())
        .filter(Boolean)
        .map(v => v.replace(/^•\s*/,''));
    }

    function applyFilter(){
      const lots = svg.querySelectorAll('[data-status]');
      lots.forEach(el => {
        const st = el.getAttribute('data-status') || 'unlisted';
        const show = (currentFilter === 'all') || (st === currentFilter);
        el.style.display = show ? '' : 'none';
      });

      // labels & badges match their lot via data-for
      const texts = svg.querySelectorAll('[data-for]');
      texts.forEach(t => {
        const st = t.getAttribute('data-status') || 'unlisted';
        const show = (currentFilter === 'all') || (st === currentFilter);
        t.style.display = show ? '' : 'none';
      });
    }

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        applyFilter();
      });
    });

    async function main(){
      const lotsRes = await fetch(LOTS_JSON_URL, { cache: 'no-store' });
      if (!lotsRes.ok) throw new Error(`Lots JSON failed: ${lotsRes.status}`);
      const shapeData = await lotsRes.json();

      const csvRes = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
      if (!csvRes.ok) throw new Error(`Sheet CSV failed: ${csvRes.status}`);
      const csvText = await csvRes.text();

      const sheetObjs = rowsToObjects(parseCSV(csvText));

      // Lookup by normalized lot id
      const sheetByLot = new Map();
      for (const row of sheetObjs){
        const key = normalizeLotId(row['Lot ID'] || row['LotID'] || row['Lot'] || row['Lot Id'] || '');
        if (key) sheetByLot.set(key, row);
      }

      // Draw
      svg.innerHTML = '';
      const shapes = (shapeData.shapes || []).filter(s => Array.isArray(s.points) && s.points.length);

      // viewBox fit
      const allPts = shapes.flatMap(s => s.points);
      if (allPts.length) setViewBoxToFit(allPts);

      debugEl.textContent = `Sheet rows loaded: ${sheetObjs.length} | Shapes: ${shapes.length} | Matched lots: ${sheetByLot.size}`;

      // Layer groups so labels always on top
      const gLots = document.createElementNS('http://www.w3.org/2000/svg','g');
      const gLabels = document.createElementNS('http://www.w3.org/2000/svg','g');
      svg.appendChild(gLots);
      svg.appendChild(gLabels);

      // If your JSON has non-lot shapes, we’ll draw them very lightly in the back.
      // Anything with a label/id that normalizes to a lot will be treated as a lot.
      for (const s of shapes){
        const lotKey = normalizeLotId(s.label || s.name || s.id || '');
        const isLot = /^B\d+\s*-\s*L\d+$/i.test(lotKey);

        // If it doesn't look like a lot, draw it faint and skip labels/click
        if (!isLot){
          const bg = document.createElementNS('http://www.w3.org/2000/svg','path');
          bg.setAttribute('d', polygonPath(s.points));
          bg.setAttribute('fill', 'rgba(0,0,0,0.02)');
          bg.setAttribute('stroke', 'rgba(0,0,0,0.25)');
          bg.setAttribute('stroke-width', '2');
          gLots.appendChild(bg);
          continue;
        }

        const row = sheetByLot.get(lotKey) || null;
        const status = row ? row['Status'] : 'Unlisted';
        const price  = row ? row['Price'] : '';
        const lotSize = row ? row['Lot Size'] : '';
        const notes = row ? row['Notes'] : '';
        const reserve = (row && row['Reserve']) ? row['Reserve'] : DEFAULT_RESERVE_URL;

        const stKey = statusKey(status);

        // Lot polygon
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d', polygonPath(s.points));
        path.setAttribute('fill', fillForStatus(status));
        path.setAttribute('stroke', '#111');
        path.setAttribute('stroke-width', '3');
        path.setAttribute('class', 'lot');
        path.setAttribute('data-lot', lotKey);
        path.setAttribute('data-status', stKey);

        path.addEventListener('click', () => {
          pTitle.textContent = lotKey;

          const parts = [];
          parts.push(`Status: ${status || '—'}`);
          if (price) parts.push(`Price: ${parseMoney(price) || price}`);
          if (lotSize) parts.push(`Lot Size: ${lotSize}`);
          pMeta.textContent = parts.join(' • ');

          pNotes.innerHTML = '';
          const lines = notesToLines(notes);
          if (lines.length){
            lines.forEach(line => {
              const li = document.createElement('li');
              li.textContent = line;
              pNotes.appendChild(li);
            });
          } else {
            const li = document.createElement('li');
            li.textContent = 'Details coming soon for this lot.';
            pNotes.appendChild(li);
          }

          // Premium badge info (optional)
          if (PREMIUM_LOTS.has(lotKey)){
            const li = document.createElement('li');
            li.textContent = 'Temple view • Teton views • Country luxury setting';
            pNotes.appendChild(li);
          }

          pReserve.href = reserve || DEFAULT_RESERVE_URL;
        });

        gLots.appendChild(path);

        // Lot label (centered, readable)
        const c = polygonCentroid(s.points);
        const label = document.createElementNS('http://www.w3.org/2000/svg','text');
        label.setAttribute('x', c.x);
        label.setAttribute('y', c.y);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'middle');
        label.setAttribute('class', 'lotLabel');
        label.setAttribute('data-for', lotKey);
        label.setAttribute('data-status', stKey);
        label.textContent = formatLabel(lotKey);
        gLabels.appendChild(label);

        // Premium badge (optional) – sits slightly below the label
        if (PREMIUM_LOTS.has(lotKey)){
          const badge = document.createElementNS('http://www.w3.org/2000/svg','text');
          badge.setAttribute('x', c.x);
          badge.setAttribute('y', c.y + 18);
          badge.setAttribute('text-anchor', 'middle');
          badge.setAttribute('dominant-baseline', 'middle');
          badge.setAttribute('class', 'badge');
          badge.setAttribute('data-for', lotKey);
          badge.setAttribute('data-status', stKey);
          badge.textContent = 'Views';
          gLabels.appendChild(badge);
        }
      }

      applyFilter();
    }

    main().catch(err => {
      console.error(err);
      debugEl.textContent = `Error: ${err.message}`;
    });
  </script>
</body>
</html>
